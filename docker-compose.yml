# ==============================================================
# GTEL Talento ATS - Orquestador Docker Compose
# Arquitectura Multi-Contenedor: MySQL 8 + Spring Boot + Nginx/React
# ==============================================================

services:
  # ------------------------------------------------------------
  # Servicio 1: Base de Datos Relacional MySQL 8
  # ------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: gtel-mysql
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gtel_talento}
      MYSQL_USER: ${MYSQL_USER:-gtel_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/gtel_talento.sql:/docker-entrypoint-initdb.d/01_gtel_talento.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - gtel-network

  # ------------------------------------------------------------
  # Servicio 2: Backend Spring Boot (Java 21)
  # ------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gtel-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-gtel_talento}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-gtel_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in .env}
      JPA_DDL_AUTO: validate
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      RECOVERY_URL: ${RECOVERY_URL:-http://localhost:3000/recuperar-acceso}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in .env}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:?Define OTP_HASH_SECRET in .env}
      TEST_ACCESS_ENABLED: ${TEST_ACCESS_ENABLED:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:?Define MAIL_USERNAME in .env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Define MAIL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - uploads_cv:/app/uploads/cv
    networks:
      - gtel-network

  # ------------------------------------------------------------
  # Servicio 3: Frontend React + Nginx (Proxy Inverso)
  # ------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: gtel-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:80"
    networks:
      - gtel-network

# --------------------------------------------------------------
# Volúmenes Persistentes y Redes Aisladas
# --------------------------------------------------------------
volumes:
  mysql_data:
    name: gtel_mysql_data
  uploads_cv:
    name: gtel_uploads_cv

networks:
  gtel-network:
    name: gtel_network
    driver: bridge
