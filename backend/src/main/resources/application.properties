spring.application.name=gtel-talento-backend
spring.config.import=optional:file:./config/local.properties
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.frontend-url=${FRONTEND_URL:http://localhost:5173,http://127.0.0.1:5173}
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Private credentials belong in environment variables or config/local.properties.
spring.mvc.problemdetails.enabled=true

# Gmail SMTP: credentials belong only in local.properties or environment.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.debug=false
otp.hash-secret=${OTP_HASH_SECRET}

# Development-only seeded account exceptions. Disabled unless explicitly enabled locally.
app.security.test-access-enabled=${TEST_ACCESS_ENABLED:false}

# Evita registrar cuerpos de autenticacion y tokens si se activa debug global.
logging.level.org.springframework.web=INFO

# Flujo de reclutamiento (migracion 004 requerida).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.recovery-url=${RECOVERY_URL:http://localhost:5173/recuperar-acceso}
app.notifications.email-enabled=${NOTIFICATION_EMAIL_ENABLED:false}

# Observabilidad: health publico y metricas protegidas por ADMIN en SecurityConfig.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@
