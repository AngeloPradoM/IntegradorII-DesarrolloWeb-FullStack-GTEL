spring.application.name=gtel-talento-backend
spring.config.import=optional:file:./config/local.properties
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gtel_talento?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.frontend-url=${FRONTEND_URL:http://localhost:5173,http://127.0.0.1:5173}
jwt.secret=${8038c15dee51ba3d4d72cf6387caff388dab09033fd5c21539fc79983e5e1a97b7253d2aa0ea5f455d13f3218158df20}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Private credentials belong in environment variables or config/local.properties.
spring.mvc.problemdetails.enabled=true

# Gmail SMTP: credentials belong only in local.properties or environment.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.debug=false
otp.hash-secret=${OTP_HASH_SECRET}

# Development-only seeded account exceptions. Disabled unless explicitly enabled locally.
app.security.test-access-enabled=${TEST_ACCESS_ENABLED:false}

# Evita registrar cuerpos de autenticacion y tokens si se activa debug global.
logging.level.org.springframework.web=INFO
