spring.application.name=gtel-talento-backend
spring.config.import=optional:file:./config/local.properties
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gtel_talento?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.frontend-url=${FRONTEND_URL:http://localhost:5173,http://127.0.0.1:5173}
jwt.secret=${JWT_SECRET:8038c15dee51ba3d4d72cf6387caff388dab09033fd5c21539fc79983e5e1a97b7253d2aa0ea5f455d13f3218158df20}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Private credentials belong in environment variables or config/local.properties.
spring.mvc.problemdetails.enabled=true

# Gmail SMTP: credentials belong only in local.properties or environment.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.debug=false
otp.hash-secret=${OTP_HASH_SECRET:c489b14e6b22340248adcf2591b6e4e892c5a0fb7dcbf3df4612e4b478cf3349}

# Development-only seeded account exceptions. Enabled by default for local development.
app.security.test-access-enabled=${TEST_ACCESS_ENABLED:true}

# Mesa de ayuda: cada lunes a las 02:00 (Lima) archiva y elimina casos terminales
# que lleven al menos 7 dias resueltos. La retencion nunca baja de 7 dias.
app.support.cleanup-enabled=${SUPPORT_CLEANUP_ENABLED:true}
app.support.cleanup-retention-days=${SUPPORT_CLEANUP_RETENTION_DAYS:7}
app.support.cleanup-cron=${SUPPORT_CLEANUP_CRON:0 0 2 * * MON}
app.support.cleanup-zone=${SUPPORT_CLEANUP_ZONE:America/Lima}

# Evita registrar cuerpos de autenticacion y tokens si se activa debug global.
logging.level.org.springframework.web=INFO

# SpringDoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.api-docs.path=/v3/api-docs
